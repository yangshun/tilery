packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

catalog:
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  # Keep Vitest and its coverage provider aligned with the runner bundled in Vite+.
  vitest: 5.0.1
  vite-plus: 1.0.0
  '@vitest/coverage-v8': 5.0.1

allowBuilds:
  sharp: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    typescript: '>=7'
    vite: '*'
    vitest: '*'
